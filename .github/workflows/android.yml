name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FCA-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FCA-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload EQ debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FCA-EQ-debug
          path: eq/build/outputs/apk/debug/*.apk

      - name: Upload EQ release APK
        uses: actions/upload-artifact@v4
        with:
          name: FCA-EQ-release
          path: eq/build/outputs/apk/release/*.apk

      - name: Prepare release files
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release
          cp eq/build/outputs/apk/release/*.apk release/FCA-EQ.apk
          cp app/build/outputs/apk/release/*.apk release/FCA-Player.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eq-v1.0.0
          name: FCA EQ 1.0.0
          make_latest: true
          body: |
            **FCA-EQ.apk** — эквалайзер: 10 полос, усиление громкости до +30 дБ, бас, объём, реверб,
            питч, скорость, 8D, эхо, караоке. Android 9+.

            **FCA-Player.apk** — музыкальный плеер FCA.

            Скачай APK ниже (раздел Assets), открой файл на телефоне и разреши установку из неизвестных источников.
          files: |
            release/FCA-EQ.apk
            release/FCA-Player.apk
